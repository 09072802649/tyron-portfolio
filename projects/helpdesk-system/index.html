  <!-- ================= SCRIPTS ================= -->
  <script>
    // --- Error Handling & Toast Notifications ---
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      let icon = 'fa-exclamation-circle text-rose-500';
      let border = 'border-rose-500/50';
      
      if(type === 'success') {
        icon = 'fa-check-circle text-emerald-500';
        border = 'border-emerald-500/50';
      } else if (type === 'warning') {
        icon = 'fa-exclamation-triangle text-amber-500';
        border = 'border-amber-500/50';
      }

      toast.className = `toast-enter glass-card bg-slate-900/90 border-l-4 ${border} p-4 rounded shadow-2xl flex items-center gap-3 min-w-[250px]`;
      toast.innerHTML = `<i class="fas ${icon} text-lg"></i> <span class="text-sm font-medium text-white">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
    
    function setBtnLoading(btnId, isLoading, originalText) {
      const btn = document.getElementById(btnId);
      if(isLoading) {
        btn.disabled = true;
        btn.innerHTML = `Processing...`;
        btn.classList.add('opacity-75');
      } else {
        btn.disabled = false;
        btn.innerHTML = originalText;
        btn.classList.remove('opacity-75');
      }
    }

    // --- Authentication ---
    const authScreen = document.getElementById('auth-screen');
    const appDashboard = document.getElementById('app-dashboard');
    const loginForm = document.getElementById('login-form');

    // Check auth status
    if (localStorage.getItem('hd_auth') === 'true') {
      authScreen.classList.add('hidden');
      appDashboard.classList.remove('hidden');
      setTimeout(() => appDashboard.classList.remove('opacity-0'), 50);
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('auth-user').value;
      const pass = document.getElementById('auth-pass').value;

      // Validation & Error Handling
      if (!user || !pass) {
        showToast('Credentials cannot be empty', 'error');
        return;
      }
      
      if (user === 'admin' && pass === 'admin123') {
        localStorage.setItem('hd_auth', 'true');
        showToast('Authentication Successful', 'success');
        authScreen.classList.add('opacity-0');
        setTimeout(() => {
          authScreen.classList.add('hidden');
          appDashboard.classList.remove('hidden');
          setTimeout(() => appDashboard.classList.remove('opacity-0'), 50);
          fetchTickets();
        }, 500);
      } else {
        showToast('Invalid Access Credentials', 'error');
      }
    });

    function logout() {
      localStorage.removeItem('hd_auth');
      appDashboard.classList.add('opacity-0');
      setTimeout(() => {
        appDashboard.classList.add('hidden');
        authScreen.classList.remove('hidden');
        setTimeout(() => authScreen.classList.remove('opacity-0'), 50);
      }, 500);
    }

    // --- Supabase DB Initialization & Logic ---
    const _supabaseUrl = 'https://vfwkhyvecnryvdnclaow.supabase.co';
    const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmd2toeXZlY25yeXZkbmNsYW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTE1MzUsImV4cCI6MjEwNjk2NzUzNX0.Ia9Tezt_jPUnI20Fs40m-deJMn5qQT2hABiOWwSdD6w';
    let db = null;
    try {
      db = window.supabase.createClient(_supabaseUrl, _supabaseKey);
    } catch(e) {
      console.error('Supabase SDK failed to initialize:', e);
    }
    let isConnectedToSupabase = false;

    let currentTickets = [];

    // READ Operations
    async function fetchTickets() {
      try {
        if (!db) throw new Error('Supabase client not initialized');
        const { data, error } = await db.from('tickets').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        currentTickets = data || [];
        isConnectedToSupabase = true;
        
        // Update UI Indicator
        document.getElementById('db-status').innerText = "System Online (Supabase Database)";
        document.getElementById('db-status').className = "text-xs font-mono text-emerald-400";
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        
      } catch(err) {
        console.error("Supabase Error:", err);
        showToast("Supabase Error: Using Local Storage Fallback", 'warning');
        
        // Update UI Indicator
        document.getElementById('db-status').innerText = "System Online (Local Mode)";
        document.getElementById('db-status').className = "text-xs font-mono text-amber-400";
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-amber-500";
        
        const stored = localStorage.getItem('helpdesk_backup_db');
        currentTickets = stored ? JSON.parse(stored) : [];
      }
      renderUI();
    }

    // CREATE Operation + Validation
    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('c-name').value.trim();
      const email = document.getElementById('c-email').value.trim();
      const desc = document.getElementById('c-desc').value.trim();

      // Form Validation with Error Handling
      if (name.length < 2) return showToast('Reporter name must be at least 2 characters', 'error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Invalid email address format', 'error');
      if (desc.length < 10) return showToast('Description must be at least 10 characters', 'error');

      setBtnLoading('btn-submit-ticket', true, 'Save to DB');

      const newTicket = {
        code: 'TICK-' + Math.floor(1000 + Math.random() * 9000),
        reporter_name: name,
        reporter_email: email,
        device_type: document.getElementById('c-device').value,
        category: document.getElementById('c-category').value,
        priority: document.getElementById('c-priority').value,
        status: 'Open',
        description: desc,
        notes: 'System auto-assigned to technician pool.',
        created_at: new Date().toISOString()
      };

      try {
        if (isConnectedToSupabase && db) {
          const { data, error } = await db.from('tickets').insert([newTicket]).select();
          if (error) throw error;
          currentTickets.unshift(data[0]);
        } else {
          newTicket.id = Date.now().toString();
          currentTickets.unshift(newTicket);
          localStorage.setItem('helpdesk_backup_db', JSON.stringify(currentTickets));
        }
        
        showToast('Database Entry Created Successfully', 'success');
        closeCreateModal();
        renderUI();
      } catch(err) {
        showToast("Create Error: " + err.message, 'error');
      } finally {
        setBtnLoading('btn-submit-ticket', false, 'Save to DB');
      }
    });

    // UPDATE Operation
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      setBtnLoading('btn-update', true, 'Update DB');

      const id = document.getElementById('e-id').value;
      const status = document.getElementById('e-status').value;
      const priority = document.getElementById('e-priority').value;
      const notes = document.getElementById('e-notes').value.trim();
      
      try {
        if (isConnectedToSupabase && db) {
          const { data, error } = await db.from('tickets').update({ status, priority, notes }).eq('id', id).select();
          if (error) throw error;
          const idx = currentTickets.findIndex(t => t.id === id);
          if (idx !== -1 && data.length > 0) currentTickets[idx] = data[0];
        } else {
          const idx = currentTickets.findIndex(t => t.id === id);
          if (idx !== -1) {
            currentTickets[idx].status = status;
            currentTickets[idx].priority = priority;
            currentTickets[idx].notes = notes;
            localStorage.setItem('helpdesk_backup_db', JSON.stringify(currentTickets));
          }
        }
        
        showToast('Database Record Updated', 'success');
        closeEditModal();
        renderUI();
      } catch (err) {
        showToast('Update Error: ' + err.message, 'error');
      } finally {
        setBtnLoading('btn-update', false, 'Update DB');
      }
    });

    // DELETE Operation
    async function deleteTicket() {
      const id = document.getElementById('e-id').value;
      if (!confirm("CRITICAL WARNING: This will permanently delete the record from the database. Proceed?")) return;

      setBtnLoading('btn-del', true, '<i class="fas fa-trash"></i> Delete Record');

      try {
        if (isConnectedToSupabase && db) {
          const { error } = await db.from('tickets').delete().eq('id', id);
          if (error) throw error;
        }

        currentTickets = currentTickets.filter(t => t.id !== id);
        if (!isConnectedToSupabase) {
          localStorage.setItem('helpdesk_backup_db', JSON.stringify(currentTickets));
        }
        
        showToast('Record Deleted Permanently', 'warning');
        closeEditModal();
        renderUI();
      } catch(err) {
        showToast('Delete Error: ' + err.message, 'error');
      } finally {
        setBtnLoading('btn-del', false, '<i class="fas fa-trash"></i> Delete Record');
      }
    }

    // --- Search & Filter ---
    document.getElementById('search-input').addEventListener('input', renderTicketsList);
    document.getElementById('status-filter').addEventListener('change', renderTicketsList);

    // --- UI Renderers ---
    function renderUI() {
      renderMetrics();
      renderTicketsList();
    }

    function renderMetrics() {
      document.getElementById('metric-total').innerText = currentTickets.length;
      document.getElementById('metric-open').innerText = currentTickets.filter(t => t.status === 'Open').length;
      document.getElementById('metric-progress').innerText = currentTickets.filter(t => t.status === 'In Progress').length;
      document.getElementById('metric-resolved').innerText = currentTickets.filter(t => t.status === 'Resolved' || t.status === 'Closed').length;
    }

    function renderTicketsList() {
      const container = document.getElementById('tickets-container');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;

      // SEARCH Implementation
      const filtered = currentTickets.filter(t => {
        const matchSearch = t.code.toLowerCase().includes(searchTerm) || 
                            t.reporter_name.toLowerCase().includes(searchTerm) || 
                            t.device_type.toLowerCase().includes(searchTerm);
        const matchStatus = statusFilter === 'All' || t.status === statusFilter;
        return matchSearch && matchStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full glass-card p-10 text-center rounded-xl flex flex-col items-center justify-center border border-rose-500/20">
            <i class="fas fa-search text-4xl text-rose-500/50 mb-3"></i>
            <p class="text-rose-400">No records found in database matching search criteria.</p>
          </div>`;
        return;
      }

      const getStatusColor = (s) => s==='Open'?'text-cyan-400 bg-cyan-400/10 border-cyan-400/30' : s==='In Progress'?'text-amber-400 bg-amber-400/10 border-amber-400/30' : s==='Resolved'?'text-emerald-400 bg-emerald-400/10 border-emerald-400/30' : 'text-slate-400 bg-slate-500/10 border-slate-500/30';
      const getPriorityIcon = (p) => p==='Critical'?'<i class="fas fa-exclamation-triangle text-rose-500"></i>':p==='High'?'<i class="fas fa-arrow-up text-orange-500"></i>':p==='Medium'?'<i class="fas fa-equals text-blue-400"></i>':'<i class="fas fa-arrow-down text-slate-400"></i>';
      const getDeviceIcon = (d) => d.includes('Laptop')?'fa-laptop':d.includes('Network')?'fa-network-wired':d.includes('Server')?'fa-server':d.includes('Mobile')?'fa-mobile-screen':'fa-desktop';
      const formatDate = (d) => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

      container.innerHTML = filtered.map(t => `
        <div class="glass-card rounded-xl p-5 border-t-2 ${t.status === 'Open' ? 'border-t-cyan-500' : t.status === 'In Progress' ? 'border-t-amber-500' : t.status === 'Resolved' ? 'border-t-emerald-500' : 'border-t-slate-500'} flex flex-col justify-between cursor-pointer hover:-translate-y-1 transition-transform" onclick="openEditModal('${t.id}')">
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="font-mono text-xs font-bold text-[#00F2FE] bg-[#00F2FE]/10 px-2 py-1 rounded border border-[#00F2FE]/20">${t.code}</span>
              <span class="text-xs px-2 py-1 rounded-full border ${getStatusColor(t.status)}">${t.status}</span>
            </div>
            <h4 class="text-white font-semibold mb-1 line-clamp-1">${t.category}</h4>
            <p class="text-xs text-slate-400 line-clamp-2 mb-4 h-8 overflow-hidden">${t.description}</p>
          </div>
          <div class="border-t border-white/10 pt-3 flex justify-between items-center text-xs text-slate-400">
            <div class="flex items-center gap-2 truncate max-w-[50%]">
              <i class="fas ${getDeviceIcon(t.device_type)}"></i>
              <span class="truncate">${t.reporter_name}</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
              ${getPriorityIcon(t.priority)}
              <span>${formatDate(t.created_at)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // --- Modal Logic ---
    function openCreateModal() { document.getElementById('create-form').reset(); document.getElementById('create-modal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
    function openEditModal(id) {
      const t = currentTickets.find(ticket => ticket.id === id);
      if (!t) return showToast('Error reading database record', 'error');
      
      document.getElementById('e-id').value = t.id;
      document.getElementById('e-ticket-code').innerText = t.code;
      document.getElementById('e-display-name').innerText = t.reporter_name + ' - ' + t.category;
      document.getElementById('e-display-desc').innerText = t.description;
      document.getElementById('e-status').value = t.status;
      document.getElementById('e-priority').value = t.priority;
      document.getElementById('e-notes').value = t.notes || '';
      document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    // Init if already authenticated
    if (localStorage.getItem('hd_auth') === 'true') { fetchTickets(); }
  </script>
</body>
</html>
