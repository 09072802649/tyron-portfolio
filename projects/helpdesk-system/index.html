<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT HELP DESK SYSTEM v3.0 - Full Stack Architecture</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cyber-bg': '#080C14',
            'cyber-card': 'rgba(15, 23, 42, 0.85)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #080C14;
      color: #94A3B8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(79, 172, 254, 0.05) 0%, transparent 45%);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #080C14; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00F2FE; }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    .toast-enter { animation: slideIn 0.3s forwards; }
    .toast-exit { animation: slideOut 0.3s forwards; }
    
    .loader {
      border: 3px solid rgba(0, 242, 254, 0.1);
      border-top: 3px solid #00F2FE;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="antialiased relative">

  <div id="edit-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-sm hidden flex justify-center items-start pt-10 pb-10 overflow-y-auto px-4">

          <div class="flex gap-2">

  <script>
    /* ================= FULL STACK ARCHITECTURE SIMULATION ================= */
    
    // --- 1. Database & Server Simulation ---
    // We wrap all DB interactions in Promises with setTimeout to simulate real server latency and error rates
    const SERVER_LATENCY = 600; // ms
    
    class MockServer {
      static get(key) {
        return new Promise((resolve) => {
          setTimeout(() => {
            resolve(JSON.parse(localStorage.getItem(key)) || []);
          }, SERVER_LATENCY);
        });
      }
      static set(key, data) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            try {
              localStorage.setItem(key, JSON.stringify(data));
              resolve(true);
            } catch(e) { reject(new Error("Server 500: Database Write Failed")); }
          }, SERVER_LATENCY / 2);
        });
      }
    }

    // --- 2. State Management ---
    let appState = {
      user: null, // { username: 'admin', role: 'admin' }
      tickets: [],
      currentPage: 1,
      itemsPerPage: 6
    };

    // --- 3. UI Helpers ---
    function showToast(msg, type = 'error') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      const icon = type==='success'?'fa-check-circle text-emerald-500':type==='warning'?'fa-exclamation-triangle text-amber-500':'fa-exclamation-circle text-rose-500';
      const border = type==='success'?'border-emerald-500/50':type==='warning'?'border-amber-500/50':'border-rose-500/50';
      t.className = `toast-enter glass-card bg-slate-900/90 border-l-4 ${border} p-4 rounded shadow-2xl flex items-center gap-3`;
      t.innerHTML = `<i class="fas ${icon} text-lg"></i> <span class="text-sm font-medium text-white">${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => { t.classList.replace('toast-enter','toast-exit'); setTimeout(()=>t.remove(), 300); }, 3500);
    }
    
    function setBtnLoading(btnId, isLoading, originalText) {
      const btn = document.getElementById(btnId);
      if(isLoading) {
        btn.disabled = true;
        btn.innerHTML = `<div class="loader !w-4 !h-4 !border-2 mr-2"></div> Processing`;
        btn.classList.add('opacity-75');
      } else {
        btn.disabled = false;
        btn.innerHTML = originalText;
        btn.classList.remove('opacity-75');
      }
    }

    // --- 4. Authentication (Roles & Secure Session) ---
    const DB_KEY = 'helpdesk_db_v3';
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('auth-user').value.trim();
      const p = document.getElementById('auth-pass').value.trim();
      
      if(!u || !p) return showToast('Server Error: Missing Payload', 'error');
      
      setBtnLoading('btn-login', true);
      
      // Simulate Auth API Call
      setTimeout(() => {
        setBtnLoading('btn-login', false, '<span>Authenticate</span> <i class="fas fa-arrow-right ml-2"></i>');
        if (u === 'admin' && p === 'admin123') {
          loginSuccess({ username: 'Admin User', role: 'admin' });
        } else if (u === 'user' && p === 'user123') {
          loginSuccess({ username: 'Standard User', role: 'user' });
        } else {
          showToast('401 Unauthorized: Invalid Credentials', 'error');
        }
      }, 1000);
    });

    function loginSuccess(userObj) {
      appState.user = userObj;
      localStorage.setItem('hd_session', JSON.stringify(userObj));
      document.getElementById('current-user-name').innerText = userObj.username;
      document.getElementById('current-user-role').innerText = userObj.role;
      
      showToast('200 OK: Authentication Token Generated', 'success');
      document.getElementById('auth-screen').classList.add('opacity-0');
      setTimeout(() => {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-dashboard').classList.remove('hidden');
        setTimeout(() => document.getElementById('app-dashboard').classList.remove('opacity-0'), 50);
        fetchData();
      }, 500);
    }

    function logout() {
      localStorage.removeItem('hd_session');
      appState.user = null;
      document.getElementById('app-dashboard').classList.add('opacity-0');
      setTimeout(() => {
        document.getElementById('app-dashboard').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
        setTimeout(() => document.getElementById('auth-screen').classList.remove('opacity-0'), 50);
      }, 500);
    }

    // Check existing session
    const session = localStorage.getItem('hd_session');
    if(session) loginSuccess(JSON.parse(session));

    // --- 5. Database Interaction (CRUD & Server-side Validation) ---
    async function fetchData() {
      document.getElementById('tickets-container').innerHTML = '';
      document.getElementById('loader-state').classList.replace('hidden', 'flex');
      
      try {
        let data = await MockServer.get(DB_KEY);
        if (data.length === 0) {
          // Seed database if empty
          data = [{ id: '1', code: 'TICK-1001', reporter_name: 'Standard User', device_type: 'Laptop/PC', category: 'Hardware', priority: 'High', status: 'Open', description: 'Screen flickering', created_at: new Date().toISOString() }];
          await MockServer.set(DB_KEY, data);
        }
        appState.tickets = data;
        renderUI();
      } catch(err) {
        showToast(err.message, 'error');
      } finally {
        document.getElementById('loader-state').classList.replace('flex', 'hidden');
      }
    }

    // CREATE (With Server-Side Mock Validation)
    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const desc = document.getElementById('c-desc').value.trim();
      
      if(desc.length < 10) return showToast('400 Bad Request: Description too short.', 'error');
      
      setBtnLoading('btn-submit-ticket', true, 'Save Record');
      
      const newTicket = {
        id: Date.now().toString(),
        code: 'TICK-' + Math.floor(1000 + Math.random() * 9000),
        reporter_name: appState.user.username, // Auto-assign reporter based on authenticated user
        device_type: document.getElementById('c-device').value,
        category: document.getElementById('c-category').value,
        priority: document.getElementById('c-priority').value,
        status: 'Open',
        description: desc,
        created_at: new Date().toISOString()
      };

      try {
        appState.tickets.unshift(newTicket);
        await MockServer.set(DB_KEY, appState.tickets);
        showToast('201 Created: Inserted into Database', 'success');
        closeCreateModal();
        renderUI();
      } catch(err) {
        showToast(err.message, 'error');
      } finally {
        setBtnLoading('btn-submit-ticket', false, 'Save Record');
      }
    });

    // UPDATE (With Role-Based Authorization)
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Authorization Check
      if (appState.user.role !== 'admin') {
        return showToast('403 Forbidden: Standard users cannot modify ticket metadata.', 'error');
      }

      setBtnLoading('btn-update', true, 'Update DB');
      
      const id = document.getElementById('e-id').value;
      const idx = appState.tickets.findIndex(t => t.id === id);
      
      try {
        appState.tickets[idx].status = document.getElementById('e-status').value;
        appState.tickets[idx].priority = document.getElementById('e-priority').value;
        appState.tickets[idx].notes = document.getElementById('e-notes').value;
        await MockServer.set(DB_KEY, appState.tickets);
        showToast('200 OK: Record Updated', 'success');
        closeEditModal();
        renderUI();
      } catch(err) {
        showToast(err.message, 'error');
      } finally {
        setBtnLoading('btn-update', false, 'Update DB');
      }
    });

    // DELETE
    async function deleteTicket() {
      if (appState.user.role !== 'admin') {
        return showToast('403 Forbidden: Only Administrators can perform DELETE ops.', 'error');
      }
      if (!confirm("Are you sure? This sends a DELETE request to the database.")) return;
      
      setBtnLoading('btn-del', true, '<i class="fas fa-trash"></i> Delete');
      const id = document.getElementById('e-id').value;
      
      try {
        appState.tickets = appState.tickets.filter(t => t.id !== id);
        await MockServer.set(DB_KEY, appState.tickets);
        showToast('200 OK: Record Destroyed', 'warning');
        closeEditModal();
        renderUI();
      } catch(err) {
        showToast(err.message, 'error');
      } finally {
        setBtnLoading('btn-del', false, '<i class="fas fa-trash"></i> Delete');
      }
    }

    // --- 6. Advanced Server-Side Data Processing (Pagination & Filtering) ---
    function renderUI() {
      // Metric aggregations
      document.getElementById('metric-total').innerText = appState.tickets.length;
      document.getElementById('metric-open').innerText = appState.tickets.filter(t => t.status === 'Open').length;
      document.getElementById('metric-progress').innerText = appState.tickets.filter(t => t.status === 'In Progress').length;
      document.getElementById('metric-resolved').innerText = appState.tickets.filter(t => t.status === 'Resolved' || t.status === 'Closed').length;

      // Filtering + Role Filtering
      const term = document.getElementById('search-input').value.toLowerCase();
      const stat = document.getElementById('status-filter').value;
      
      let processedData = appState.tickets.filter(t => {
        // Role check: Admin sees all, User sees only their own
        if (appState.user.role === 'user' && t.reporter_name !== appState.user.username) return false;
        
        const matchSearch = t.code.toLowerCase().includes(term) || t.reporter_name.toLowerCase().includes(term);
        const matchStatus = stat === 'All' || t.status === stat;
        return matchSearch && matchStatus;
      });

      // Pagination Calculation
      const totalItems = processedData.length;
      const totalPages = Math.ceil(totalItems / appState.itemsPerPage) || 1;
      if (appState.currentPage > totalPages) appState.currentPage = totalPages;
      
      const start = (appState.currentPage - 1) * appState.itemsPerPage;
      const paginatedData = processedData.slice(start, start + appState.itemsPerPage);

      // Render Pagination Info
      document.getElementById('pagination-info').innerText = `Showing ${totalItems === 0 ? 0 : start + 1}-${Math.min(start + appState.itemsPerPage, totalItems)} of ${totalItems} DB Rows`;
      document.getElementById('btn-prev').disabled = appState.currentPage === 1;
      document.getElementById('btn-next').disabled = appState.currentPage === totalPages;

      // Render Grid
      const container = document.getElementById('tickets-container');
      if (paginatedData.length === 0) {
        container.innerHTML = `<div class="col-span-full glass-card p-10 text-center rounded-xl border border-rose-500/20"><p class="text-rose-400">404 Not Found: No records match the query</p></div>`;
        return;
      }

      container.innerHTML = paginatedData.map(t => {
        const c = t.status==='Open'?'text-cyan-400 border-cyan-400/30' : t.status==='In Progress'?'text-amber-400 border-amber-400/30' : 'text-emerald-400 border-emerald-400/30';
        return `
        <div class="glass-card rounded-xl p-5 border-t-2 ${t.status==='Open'?'border-t-cyan-500':t.status==='In Progress'?'border-t-amber-500':'border-t-emerald-500'} cursor-pointer hover:-translate-y-1 transition-transform" onclick="openEditModal('${t.id}')">
          <div class="flex justify-between items-start mb-3">
            <span class="font-mono text-xs font-bold text-[#00F2FE] bg-[#00F2FE]/10 px-2 py-1 rounded border border-[#00F2FE]/20">${t.code}</span>
            <span class="text-xs px-2 py-1 rounded-full border ${c} bg-opacity-10">${t.status}</span>
          </div>
          <h4 class="text-white font-semibold mb-1 truncate">${t.category}</h4>
          <p class="text-xs text-slate-400 line-clamp-2 mb-4 h-8">${t.description}</p>
          <div class="border-t border-white/10 pt-3 flex justify-between items-center text-xs text-slate-400">
            <span class="truncate max-w-[50%]"><i class="fas fa-user text-slate-500 mr-1"></i> ${t.reporter_name}</span>
            <span>${new Date(t.created_at).toLocaleDateString()}</span>
          </div>
        </div>`;
      }).join('');
    }

    function changePage(delta) {
      appState.currentPage += delta;
      renderUI();
    }

    document.getElementById('search-input').addEventListener('input', () => { appState.currentPage = 1; renderUI(); });
    document.getElementById('status-filter').addEventListener('change', () => { appState.currentPage = 1; renderUI(); });

    // Modals
    function openCreateModal() { document.getElementById('create-form').reset(); document.getElementById('create-modal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
    function openEditModal(id) {
      const t = appState.tickets.find(ticket => ticket.id === id);
      if (!t) return;
      document.getElementById('e-id').value = t.id;
      document.getElementById('e-ticket-code').innerText = t.code;
      document.getElementById('e-display-name').innerText = t.reporter_name + ' - ' + t.category;
      document.getElementById('e-display-desc').innerText = t.description;
      document.getElementById('e-status').value = t.status;
      document.getElementById('e-priority').value = t.priority;
      document.getElementById('e-notes').value = t.notes || '';
      
      // Strict UI locking for 'user' role
      const isAdmin = appState.user.role === 'admin';
      document.getElementById('e-status').disabled = !isAdmin;
      document.getElementById('e-priority').disabled = !isAdmin;
      document.getElementById('btn-del').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('btn-update').style.display = isAdmin ? 'block' : 'none';

      document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

  </script>
</body>
</html>
